name: paper-engine

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Bu calisma kac dakika sursun (GitHub job limiti ~6 saat)"
        default: "345"
        required: false
  schedule:
    - cron: "10 */6 * * *"   # yedek: motor dusmusse kampanya bitene kadar tekrar baslat

permissions:
  contents: write
  actions: write

concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -q requests numpy scikit-learn
      - name: run engine
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python engine.py "${{ github.event.inputs.minutes || '345' }}"
      - name: chain next run if campaign not over
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DL=$(curl -s "https://raw.githubusercontent.com/${{ github.repository }}/state/state.json" | python3 -c "import json,sys;print(json.load(sys.stdin).get('campaign_deadline',''))" || echo "")
          if [ -n "$DL" ]; then
            NOW=$(date -u +%s); END=$(date -u -d "$DL" +%s || echo 0)
            if [ "$NOW" -lt "$END" ]; then
              echo "campaign still running (until $DL) -> dispatching next run"
              gh workflow run engine.yml -R "${{ github.repository }}" -f minutes=345 || true
            else
              echo "campaign finished"
            fi
          fi
